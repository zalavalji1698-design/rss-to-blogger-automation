name: RSS to Blogger Automation

on:
  schedule:
    - cron: "0 * * * *"   # हर 1 घंटे में
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss_to_blogger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
        run: |
          python main.py

      - name: Commit posted_urls.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update posted RSS URLs"
            git push
          fi
