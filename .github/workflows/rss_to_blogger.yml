name: RSS to Blogger Automation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss_to_blogger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          echo "✅ Git configured"

      - name: Run RSS to Blogger automation
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
        run: |
          echo "🚀 Starting RSS to Blogger automation..."
          python main.py
          echo "✅ Automation completed"

      - name: Fetch remote changes
        run: |
          echo "📥 Fetching remote changes..."
          git fetch origin main --quiet
          echo "✅ Remote fetch completed"

      - name: Check git status
        run: |
          echo "📊 Git Status:"
          git status
          echo ""
          echo "📋 Modified files:"
          git diff --name-only
          echo ""
          echo "🔍 Staged changes:"
          git diff --cached --name-only

      - name: Prepare for rebase
        run: |
          echo "🧹 Cleaning unstaged changes..."
          git stash || true
          echo "✅ Unstaged changes stashed"

      - name: Rebase with remote
        run: |
          echo "🔄 Rebasing with remote branch..."
          if git rev-parse @{u} >/dev/null 2>&1; then
            echo "📌 Remote branch exists, rebasing..."
            git rebase origin/main || {
              echo "⚠️ Rebase conflict detected, aborting rebase..."
              git rebase --abort
              echo "ℹ️ Will attempt direct merge instead"
            }
          else
            echo "ℹ️ No upstream branch configured"
          fi
          echo "✅ Rebase step completed"

      - name: Stage changes
        run: |
          echo "📝 Staging changes..."
          if [ -f "posted_urls.json" ]; then
            git add posted_urls.json
            echo "✅ posted_urls.json staged"
          fi
          if [ -f "automation.log" ]; then
            git add automation.log
            echo "✅ automation.log staged"
          fi
          echo ""
          echo "📋 Current staged files:"
          git diff --cached --name-only

      - name: Commit changes
        run: |
          echo "💾 Checking for changes..."
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          echo "📝 Committing changes..."
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "✅ RSS Automation: $(date '+%Y-%m-%d %H:%M:%S')" \
            --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          echo "✅ Commit created"
          git log --oneline -1

      - name: Push changes safely
        run: |
          echo "🚀 Pushing changes..."

          git fetch origin main --quiet

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "⚠️ Local branch is behind remote, attempting rebase..."
            if git rebase origin/main; then
              echo "✅ Rebase successful, proceeding with push..."
            else
              echo "⚠️ Rebase failed, aborting rebase..."
              git rebase --abort
              echo "ℹ️ Using merge strategy instead..."
              git merge origin/main -m "Merge with remote branch"
            fi
          fi

          if git push origin main 2>&1 | grep -q "Everything up-to-date"; then
            echo "✅ Already up-to-date, no push needed"
          else
            echo "✅ Push completed successfully"
          fi

      - name: Handle push failure
        if: failure()
        run: |
          echo "⚠️ Push failed, attempting recovery..."

          echo "📊 Checking git log:"
          git log --oneline -5

          echo ""
          echo "📊 Checking git status:"
          git status

          echo ""
          echo "📊 Checking remote status:"
          git ls-remote origin main

          echo ""
          echo "🔄 Final attempt with force-with-lease:"
          git fetch origin main --quiet

          if ! git diff --quiet HEAD origin/main; then
            echo "⚠️ There are differences with remote, attempting merge..."
            git merge origin/main -m "Emergency merge during recovery" || {
              echo "❌ Merge failed, aborting..."
              git merge --abort
              echo "⚠️ Unable to merge, push will be skipped"
              exit 0
            }
          fi

          if git push origin main 2>&1 | grep -q "Everything up-to-date"; then
            echo "✅ Successfully pushed or already up-to-date"
          else
            echo "❌ Final push attempt failed"
            exit 1
          fi

      - name: Automation success summary
        if: success()
        run: |
          echo "=========================================="
          echo "✅ RSS to Blogger Automation - SUCCESS"
          echo "=========================================="
          echo "⏰ Execution Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "📊 Repository: ${{ github.repository }}"
          echo "🔗 Commit: $(git rev-parse --short HEAD)"
          echo "📝 Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "=========================================="

          if [ -f "automation.log" ]; then
            echo ""
            echo "📋 Recent Log Entries:"
            tail -15 automation.log
          fi

      - name: Automation failure summary
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ RSS to Blogger Automation - FAILED"
          echo "=========================================="
          echo "⏰ Execution Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "📊 Repository: ${{ github.repository }}"
          echo "📝 Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "=========================================="

          if [ -f "automation.log" ]; then
            echo ""
            echo "📋 Error Log:"
            cat automation.log | grep -E "(ERROR|❌|Failed)" || echo "No specific errors found"
          fi

          exit 1
